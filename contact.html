<!-- ==========================
CONTACT FORM
========================== -->

<section class="contact-form">

    <div class="container">

        <div class="section-title">

            <p class="section-sub">

                CONTACT FORM

            </p>

            <h2>

                お問い合わせフォーム

            </h2>

        </div>

        <p class="section-lead">

            商品開発・OEM・ODM・お見積りなど、
            お気軽にお問い合わせください。
            内容を確認後、担当者よりご連絡いたします。

        </p>

        <form class="form-area">

            <div class="form-group">

                <label for="name">

                    お名前 <span>*</span>

                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="山田 太郎"
                    required>

            </div>

            <div class="form-group">

                <label for="company">

                    会社名

                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    placeholder="株式会社〇〇">

            </div>

            <div class="form-group">

                <label for="email">

                    メールアドレス <span>*</span>

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@example.com"
                    required>

            </div>

            <div class="form-group">

                <label for="tel">

                    電話番号

                </label>

                <input
                    type="tel"
                    id="tel"
                    name="tel"
                    placeholder="03-1234-5678">

            </div>

            <div class="form-group">

                <label for="category">

                    お問い合わせ内容

                </label>

                <select id="category" name="category">

                    <option>OEM・ODMについて</option>

                    <option>商品開発について</option>

                    <option>お見積りについて</option>

                    <option>その他</option>

                </select>

            </div>

            <div class="form-group">

                <label for="message">

                    ご相談内容 <span>*</span>

                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="8"
                    placeholder="お問い合わせ内容をご入力ください。"
                    required></textarea>

            </div>

            <div class="form-submit">

                <button type="submit" class="btn-green">

                    お問い合わせを送信する

                </button>

            </div>

        </form>

    </div>

</section>
